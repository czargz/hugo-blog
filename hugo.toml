baseURL = 'https://czargz.github.io/hugo-blog/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
title = '我的技术博客'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
paginate = 10

[params]
  env = 'production'
  author = 'Bill'
  description = '记录技术与生活'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

[params.homeInfoParams]
  Title = 'Hi 👋'
  Content = '欢迎来到我的博客。'

# 图片缓存目录（配合 GitHub Actions 缓存步骤使用）
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 30

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 40
